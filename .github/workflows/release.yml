name: Release
on:
  push:
    tags: ["v*"]
  # Dry run: builds and checks every wheel, publishes nothing. The steps that spend a version
  # number are gated on an actual tag below.
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  wheels:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: macos-15
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # On Linux, maturin-action builds inside the manylinux container, which setup-node above
      # cannot reach -- so build.rs would find no npm there. before-script-linux runs inside it.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.14
          manylinux: auto
          sccache: true
          before-script-linux: |
            set -eux
            NODE=node-v22.23.2-linux-x64
            curl -fsSL "https://nodejs.org/dist/v22.23.2/$NODE.tar.xz" | tar -xJ -C /opt
            ln -sf "/opt/$NODE/bin/node" /usr/local/bin/node
            ln -sf "/opt/$NODE/bin/npm" /usr/local/bin/npm
            node --version && npm --version
      - name: Wheel must carry V8 and fit PyPI's 100MB limit
        shell: bash
        run: |
          ls -l dist/
          for w in dist/*.whl; do
            size=$(wc -c < "$w")
            echo "$w: $size bytes"
            # A wheel without V8 statically linked is a few hundred KB, not tens of MB.
            test "$size" -gt 5000000 || { echo "wheel too small -- V8 not linked?"; exit 1; }
            test "$size" -lt 100000000 || { echo "wheel over PyPI per-file limit"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  release:
    needs: [ci, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - name: Tag must match Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(cargo metadata --format-version 1 --no-deps | jq -r .packages[0].version)"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 -c "
          import os, re, sys
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          text = open('CHANGELOG.md').read()
          m = re.search(rf'^## \[{re.escape(version)}\]\n(.*?)(?=^## \[|\Z)', text, re.M | re.S)
          sys.stdout.write(m.group(1) if m else '')
          " > release-notes.md
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "$GITHUB_REF_NAME" dist/* --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
