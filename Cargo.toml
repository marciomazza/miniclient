[package]
name = "miniclient"
version = "0.2.5-dev"
edition = "2024"
license = "MIT"
publish = false

[lib]
# rlib too, so `tests/*.rs` integration tests can link the crate; maturin still uses the cdylib.
crate-type = ["cdylib", "rlib"]
name = "_miniclient"

[lints.clippy]
# expect_used stays off on purpose: `.expect("why")` is the recommended fix for a bare
# `.unwrap()`, and the runtime's isolate-thread setup relies on it for real invariants.
unwrap_used = "warn"
todo = "warn"

[dependencies]
deno_core = "0.410.0"
deno_error = "0.7.1"
# For a real, circular-safe console (see pre_globals.js). deno_web requires deno_webidl.
deno_web = "0.288.0"
deno_webidl = "0.257.0"
# Real CSPRNG for `crypto` (see pre_globals.js): fills getRandomValues, backs randomUUID.
getrandom = "0.4"
uuid = { version = "1", features = ["v4"] }
# `extension-module` comes from maturin's `features` in pyproject.toml, not from here:
# baked in, it leaves Python symbols undefined and `cargo test` cannot link.
pyo3 = { version = "0.29", features = ["experimental-async"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
regex = "1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }

[build-dependencies]
# build.rs bakes the deno_webidl + deno_web ESM into a base V8 snapshot: deno_core 0.410
# only records those sources as build-machine disk paths, so a wheel that ran create_snapshot
# at runtime would try (and fail) to read /root/.cargo. Keep these versions in lockstep with
# [dependencies].
deno_core = "0.410.0"
deno_web = "0.288.0"
deno_webidl = "0.257.0"

[dev-dependencies]
# Only active for `cargo test`/benches/examples, never the extension-module wheel build (that
# build never pulls in [dev-dependencies]) -- `auto-initialize` and `extension-module` conflict,
# since an extension module doesn't own the interpreter but a standalone `cargo test` binary does.
pyo3 = { version = "0.29", features = ["auto-initialize"] }
# Integration tests decode the JSON text `send_eval` returns back into Rust values.
serde_json = "1"
