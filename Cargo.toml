[package]
name = "miniclient"
version = "0.3.0-dev"
edition = "2024"
license = "MIT"
publish = false

[lib]
# rlib too, so `tests/*.rs` integration tests can link the crate; maturin still uses the cdylib.
crate-type = ["cdylib", "rlib"]
name = "_miniclient"

[dependencies]
async-trait = "0.1"
deno_core = "0.412.0"
# deno_core 0.412 pins deno_error at exactly 0.7.1; using 0.7.3 fails resolution.
deno_error = "0.7.1"
deno_fetch = "0.283.0"
deno_net = "0.251.0"
# For a real, circular-safe console (see pre_globals.js). deno_web requires deno_webidl.
deno_web = "0.290.0"
deno_webidl = "0.259.0"
# Real CSPRNG for `crypto` (see pre_globals.js): fills getRandomValues, backs randomUUID.
getrandom = "0.4"
# `extension-module` comes from maturin's `features` in pyproject.toml, not from here:
# baked in, it leaves Python symbols undefined and `cargo test` cannot link.
pyo3 = { version = "0.29", features = ["experimental-async"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
pythonize = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
# Rust-backed DOM tree: an `ego-tree` arena filled by `html5ever` and matched with `selectors`.
# selectors pulls a second cssparser (0.38) alongside deno_web's 0.36 -- a harmless duplicate
# compile.
ego-tree = "0.11"
html5ever = "0.40"
selectors = "0.41"
precomputed-hash = "0.1"
# Needed to drive `SelectorList::parse` directly for the native query engine; resolves to the
# same 0.38 `selectors` already pulls in.
cssparser = "0.38"
# stylo owns cascade and computed values for `getComputedStyle`; unmodified MPL-2.0 crates, listed
# in the wheel's MPL notice.
stylo = "0.22"
stylo_dom = "0.22"
stylo_static_prefs = "0.22"
stylo_traits = "0.22"
euclid = "0.22"
app_units = "0.7"
url = "2"

[dev-dependencies]
glob = "0.3"
# Property-based port of tests/hypothesis/*.py (ticket 13). No proptest-state-machine: the
# ported suites aren't state machines.
proptest = "1.11"
regex = "1"
# Only active for `cargo test`/benches/examples, never the extension-module wheel build (that
# build never pulls in [dev-dependencies]) -- `auto-initialize` and `extension-module` conflict,
# since an extension module doesn't own the interpreter but a standalone `cargo test` binary does.
pyo3 = { version = "0.29", features = ["auto-initialize"] }

[build-dependencies]
# build.rs bakes the deno_webidl + deno_web ESM into a base V8 snapshot: deno_core 0.412
# only records those sources as build-machine disk paths, so a wheel that ran create_snapshot
# at runtime would try (and fail) to read /root/.cargo. Keep these versions in lockstep with
# [dependencies].
deno_core = "0.412.0"
deno_fetch = "0.283.0"
deno_net = "0.251.0"
deno_web = "0.290.0"
deno_webidl = "0.259.0"
# Pinned to match pyo3 0.29 -- add_libpython_rpath_link_args() bakes LC_RPATH into the
# test binary so `cargo test` finds libpython on macOS (mise-installed Python).
pyo3-build-config = "=0.29.2"
# build.rs compiles src/dom.rs, src/dom_ops.rs and src/dom_query.rs to register the DOM ops
# in the snapshot. Keep these in lockstep with [dependencies] too.
cssparser = "0.38"
ego-tree = "0.11"
html5ever = "0.40"
selectors = "0.41"
serde = { version = "1.0.229", features = ["derive"] }
stylo = "0.22"
stylo_dom = "0.22"
stylo_static_prefs = "0.22"
url = "2"

[lints.clippy]
todo = "warn"
# expect_used stays off on purpose: `.expect("why")` is the recommended fix for a bare
# `.unwrap()`, and the runtime's isolate-thread setup relies on it for real invariants.
unwrap_used = "warn"

[profile.dev]
# Smaller objects and faster links; backtraces keep file:line.
debug = "line-tables-only"
