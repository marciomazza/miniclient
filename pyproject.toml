# Metadados do projeto
[project]
name = "miniclient"
description = "A minimal python http client that runs real JS/DOM, without a browser"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "httpx2~=2.6.0",
  "jsrun~=0.1.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/marciomazza/miniclient"
Repository = "https://github.com/marciomazza/miniclient"

# Grupos de dependências para desenvolvimento e testes
[dependency-groups]
dev = ["ipdb", "ipython", "ipython-autoimport", "zensical"]
lint = ["prek~=0.4.9", "pyrefly~=1.1.1", "ruff~=0.15.22"]
test = [
  "httpx2-pytest~=1.0.1",
  "hypothesis~=6.156.6",
  "more-itertools~=11.1.0",
  "playwright~=1.61.0",
  "pydantic~=2.13.4",
  "pytest~=9.1.1",
  "pytest-asyncio~=1.4.0",
  "pytest-cov~=7.1.0",
  "pytest-playwright~=0.8.0",
  "pytest-timeout~=2.4.0",
  "pytest-xdist~=3.8.0",
]

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[tool.coverage.report]
exclude_also = []

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "miniclient._miniclient"
python-source = "python"
# build.rs generates these, so they are gitignored and maturin would otherwise skip them.
include = [
  { path = "python/miniclient/js/_generated/happy-dom-bundle.js", format = ["sdist", "wheel"] },
  { path = "python/miniclient/_vendor/**/*", format = ["sdist", "wheel"] },
  # The npm sources the bundle embeds, plus their licences, so the sdist carries what it
  # redistributes. Wider than build.rs's VENDORED list, which omits happy-dom's sources.
  # It is not an offline build: build.rs still runs `npm ci`.
  { path = "node_modules/happy-dom/lib/**/*", format = "sdist" },
  { path = "node_modules/happy-dom/LICENSE", format = "sdist" },
  { path = "node_modules/xpath/xpath.js", format = "sdist" },
  { path = "node_modules/xpath/LICENSE", format = "sdist" },
  { path = "node_modules/text-encoding/lib/encoding.js", format = "sdist" },
  { path = "node_modules/text-encoding/LICENSE.md", format = "sdist" },
  { path = "node_modules/entities/dist/esm/**/*", format = "sdist" },
  { path = "node_modules/entities/LICENSE", format = "sdist" },
]

[tool.pyrefly]
search_path = ["python", "tests"]

[tool.pytest]
addopts = [
  "--cov-report=html",
  "--cov-report=xml",
  "--cov=python/miniclient",
  "-mnot cross and not hypo"
]
filterwarnings = [
  "ignore:coroutine.*was never awaited:RuntimeWarning",
]
markers = [
  "cross: mark a test as a hypothesis cross check test",
  "hypo: mark a test as a general hypothesis test",
]
pythonpath = ["python"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
fix = true
show-fixes = true
preview = true  # required until the E402 fix stabilizes

[tool.ruff.lint]
select = [
  "I",  # https://docs.astral.sh/ruff/rules/#isort-i
  "E",  # https://docs.astral.sh/ruff/rules/#pycodestyle-e-w
  "W",
  "F",  # https://docs.astral.sh/ruff/rules/#pyflakes-f
  "B",  # https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "T201",  # https://docs.astral.sh/ruff/rules/print
  "Q",  # https://docs.astral.sh/ruff/rules/#flake8-quotes-q
]
fixable = ["ALL"]
extend-safe-fixes = ["E402"]  # isort float-to-top
unfixable = [
  "F841",  # Report but don't auto-remove unused variables
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["miniclient"]

[tool.uv]
default-groups = ["dev", "lint", "test"]
